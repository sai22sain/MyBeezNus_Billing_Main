<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Salon Admin Dashboard</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #273549;
    --line: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #f59e0b;
    --danger: #ef4444;
    --ok: #22c55e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 16px 24px; border-bottom: 1px solid var(--line);
    background: var(--panel); position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: var(--muted); font-size: 12px; margin-top: 3px; }
  main { padding: 24px; max-width: 1400px; margin: 0 auto; }
  h2 { font-size: 15px; margin: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .stat-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .stat-value { font-size: 24px; font-weight: 700; margin-top: 6px; }
  section { margin-top: 28px; }
  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  tbody tr:hover { background: var(--panel-2); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  th.num { text-align: right; }
  .btn {
    border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    padding: 7px 12px; border-radius: 7px; cursor: pointer; font-size: 13px;
  }
  .btn:hover { border-color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-danger { border-color: var(--danger); color: #fecaca; background: rgba(239,68,68,.14); }
  .btn-danger:hover { background: rgba(239,68,68,.28); }
  .btn-ok { border-color: var(--ok); color: #bbf7d0; background: rgba(34,197,94,.14); }
  .btn-ok:hover { background: rgba(34,197,94,.28); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #1f2937; font-weight: 600; }
  input[type="search"] {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    padding: 8px 10px; border-radius: 7px; min-width: 260px;
  }
  .badge { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge-pending { background: rgba(245,158,11,.18); color: #fcd34d; }
  .badge-approved { background: rgba(34,197,94,.18); color: #86efac; }
  .badge-rejected { background: rgba(148,163,184,.2); color: #cbd5e1; }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); padding: 18px 12px; font-style: italic; }
  .toast {
    position: fixed; right: 20px; bottom: 20px; z-index: 20;
    background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent);
    padding: 12px 16px; border-radius: 8px; max-width: 420px;
    box-shadow: 0 10px 30px rgba(0,0,0,.45); display: none; white-space: pre-wrap;
  }
  .toast.show { display: block; }
  .toast.err { border-left-color: var(--danger); }
  .spinner { color: var(--muted); padding: 20px 4px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Salon Admin Dashboard</h1>
    <div class="sub" id="subtitle">Loading&hellip;</div>
  </div>
  <button class="btn btn-primary" id="refreshBtn">Refresh</button>
</header>

<main>
  <div class="grid" id="statsGrid"></div>

  <section>
    <div class="section-head">
      <h2>Pending deletion requests</h2>
      <span class="muted" id="pendingCount"></span>
    </div>
    <div class="card" style="padding:0">
      <table>
        <thead>
          <tr>
            <th>Business</th><th>Email</th><th class="num">Bills</th><th>Requested</th><th>Status</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="requestsBody"></tbody>
      </table>
    </div>
  </section>

<section>
    <div class="section-head">
      <h2>Users</h2>
      <input type="search" id="searchBox" placeholder="Search by business, email or phone..." />
    </div>
    <div class="card" style="padding:0">
      <table>
        <thead>
          <tr>
            <th>Business</th><th>Owner</th><th>Email</th><th>Phone</th>
            <th>Joined</th><th class="num">Bills</th>
            <th class="num">Revenue</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="usersBody"></tbody>
      </table>
    </div>
  </section>

  <section>
    <div class="section-head">
      <h2>Recently deleted accounts</h2>
      <span class="muted" id="deletedCount"></span>
    </div>
    <div class="card" style="padding:0">
      <table>
        <thead>
          <tr>
            <th>Business</th><th>Email</th><th class="num">Bills</th>
            <th class="num">Customers</th><th>Deleted</th><th>By</th>
          </tr>
        </thead>
        <tbody id="deletedBody"></tbody>
      </table>
    </div>
  </section>

</main>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
